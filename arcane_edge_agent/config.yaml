---
name: Arcane Agent (Monitor)
version: 2.17.2
slug: arcane_edge_agent
description: Read-only Docker monitoring for Arcane.
url: https://github.com/affeldt28/ha-addons-arcane/tree/main/arcane_edge_agent
docker_api: true
init: true
startup: services
boot: manual
stage: experimental
arch:
- amd64
- aarch64
backup: cold
options:
  MANAGER_API_URL: ''
  AGENT_TOKEN: ''
  EDGE_TRANSPORT: poll
schema:
  MANAGER_API_URL: url
  AGENT_TOKEN: password
  EDGE_TRANSPORT: list(poll|auto|websocket|grpc)
timeout: 30
map:
- type: addon_config
  read_only: false
