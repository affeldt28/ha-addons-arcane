---
name: Arcane Agent (Monitor)
version: 3.0.1-3
slug: arcane_edge_agent
description: Read-only Docker monitoring for Arcane.
url: https://github.com/affeldt28/ha-addons-arcane/tree/main/arcane_edge_agent
docker_api: true
init: true
startup: services
boot: manual
stage: experimental
arch:
- amd64
- aarch64
backup: cold
options:
  ARCANE_MANAGER_API_URL: ''
  ARCANE_AGENT_TOKEN: ''
  ARCANE_AGENT_TRANSPORT: auto
schema:
  # Allow blank defaults during installation and migration; validate configured URLs.
  ARCANE_MANAGER_API_URL: 'match(^$|^https?://[^ /]+$)'
  ARCANE_AGENT_TOKEN: password
  ARCANE_AGENT_TRANSPORT: list(auto|websocket|grpc)
  # Keep old UI settings available for automatic Arcane 2 migration.
  MANAGER_API_URL: str?
  AGENT_TOKEN: password?
  EDGE_TRANSPORT: list(auto|poll|websocket|grpc)?
timeout: 30
map:
- type: addon_config
  read_only: false
