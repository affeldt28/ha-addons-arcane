name: Validate Arcane add-ons
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  proxy-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh -n arcane_edge_agent/run.sh
      - run: python3 tools/check_policy.py
      - run: python3 tools/test_proxy.py
