name: Validate Arcane add-ons
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: read
jobs:
  proxy-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh -n arcane_edge_agent/rootfs/usr/local/bin/run-monitor
      - name: Lint monitor startup
        run: shellcheck arcane_edge_agent/rootfs/usr/local/bin/run-monitor
      - run: python3 tools/check_policy.py
      - name: Test registry retry behavior
        run: python3 -m unittest discover -s tools -p test_build_image.py
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/test_proxy.py
