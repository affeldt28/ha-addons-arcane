---
name: Arcane Agent (Full Access)
version: 3.0.1-2
slug: arcane_edge_agent_full
description: 'WARNING: full Docker control.'
url: https://github.com/affeldt28/ha-addons-arcane/tree/main/arcane_edge_agent_full
docker_api: true
init: true
legacy: true
startup: services
boot: manual
stage: experimental
arch:
- amd64
- aarch64
backup: cold
options:
  ARCANE_MANAGER_API_URL: ''
  ARCANE_AGENT_TOKEN: ''
  ARCANE_AGENT_TRANSPORT: auto
schema:
  # Allow blank defaults during installation and migration; validate configured URLs.
  ARCANE_MANAGER_API_URL: 'match(^$|^https?://[^ /]+$)'
  ARCANE_AGENT_TOKEN: password
  ARCANE_AGENT_TRANSPORT: list(auto|websocket|grpc)
environment:
  ARCANE_AGENT: 'true'
  DOCKER_HOST: unix:///run/docker.sock
map:
- type: addon_config
  path: /app/data
  read_only: false
